# FAST 40m Core Array — nginx reverse proxy (as-built 2026-09-09)
#
# Single TLS entry point (443) for the four NiceGUI services on atlas,
# which bind 127.0.0.1 only:
#   https://atlas/scheduler/   -> 127.0.0.1:8080  obs_scheduler.py   (fast-obs-sche)
#   https://atlas/uploader/    -> 127.0.0.1:8081  obs_uploader.py    (fast-obs-load)
#   https://atlas/controller/  -> 127.0.0.1:8082  obs_controller.py  (fast-obs-ctrl)
#   https://atlas/monitor/     -> 127.0.0.1:8083  obs_monitor.py     (fast-obs-moni)
#
# NiceGUI (3.16) is reverse-proxy-ready: pages build asset and socket.io
# URLs from the X-Forwarded-Prefix header, so each location just strips
# its path prefix (trailing slash on proxy_pass!) and sets that header.
# ALL four services push UI updates over websockets — the Upgrade headers
# below are mandatory, not optional.
#
# Install on atlas:
#   scp docs/nginx_fast-obs.conf atlas:/tmp/
#   ssh atlas 'sudo install -m 644 /tmp/nginx_fast-obs.conf /etc/nginx/conf.d/fast-obs.conf && sudo nginx -t && sudo systemctl enable --now nginx'
# Prereqs (one-time): TLS cert pair (docs/https_setup.md) and
#   sudo setsebool -P httpd_can_network_connect on   # SELinux: proxy->backend connect
# Port 80 stays firewalled-off; the redirect block only serves localhost.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name atlas;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name atlas;

    ssl_certificate     /etc/pki/tls/certs/atlas.crt;
    ssl_certificate_key /etc/pki/tls/private/atlas.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Uploader accepts schedule JSON files; keep headroom over the 1m default.
    client_max_body_size 25m;

    # Bare https://atlas/ : tiny index of the four services.
    location = / {
        default_type text/html;
        return 200 "<!doctype html><meta charset='utf-8'><title>FAST 40m Core Array</title>
<body style='font-family:sans-serif;max-width:32em;margin:4em auto'>
<h2>FAST 40m Core Array</h2>
<ul>
<li><a href='/scheduler/'>Scheduler</a></li>
<li><a href='/uploader/'>Uploader</a></li>
<li><a href='/controller/'>Controller</a></li>
<li><a href='/monitor/'>ROACH2 Monitor</a></li>
</ul>
<p style='color:#666'>Self-signed cert — browsers warn once; accept to proceed.</p>";
    }

    # Bare name -> canonical trailing-slash URL (308 keeps the method).
    location = /scheduler  { return 308 /scheduler/; }
    location = /uploader   { return 308 /uploader/; }
    location = /controller { return 308 /controller/; }
    location = /monitor    { return 308 /monitor/; }

    location /scheduler/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /scheduler;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploader/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /uploader;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # This GUI DRIVES THE HARDWARE — network reach of 443 is the firewall's
    # job (restrict to admin hosts with a rich rule if needed).
    location /controller/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /controller;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /monitor/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /monitor;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
